[package]
name = "check_cards"
version = "1.5.0"
edition = "2024"
rust-version = "1.97.0"
description = "A tool for checking for issues in Artistic Swimming Coach Cards"
homepage = "https://check-cards.web.app"
keywords = ["artistic", "swimming", "artistic-swimming", "synchro"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/leahych/check_cards"

[lib]
crate-type = ["cdylib", "lib"]

# speed up dev builds a bit
[profile.dev]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'
strip = true

[lints.rust]
future-incompatible = "warn"
keyword-idents = "warn"
let-underscore = "warn"
refining-impl-trait = "warn"
warnings = "warn"
unused = { level = "warn", priority = -1 }
redundant_imports = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
enum_glob_use = "allow"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
missing-errors-doc = "allow"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
similar-names = "allow"
single_call_fn = "allow"
trivially_copy_pass_by_ref = "allow"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

expect_used = "warn"
panic = "warn"
unwrap_used = "warn"

[build-dependencies.chrono]
version = "0.4.45"
default-features = false
features = ["now"]

[dependencies]
anyhow = "1.0.104"
calamine = { version = "0.36.1", features = ["chrono"] }
console_error_panic_hook = "0.1.7"
semver = "1.0.28"
strum = "0.28"
strum_macros = "0.28"
wasm-bindgen = "0.2.126"

[dependencies.chrono]
version = "0.4.45"
default-features = false
features = ["alloc"]

[dependencies.gloo]
version = "0.12.0"
default-features = false
features = ["futures", "utils"]

[dependencies.web-sys]
version = "0.3.103"
features = ["Document", "HtmlInputElement", "HtmlTableElement", "HtmlTableSectionElement", "Text", "HtmlCollection"]

[dev-dependencies]
pretty_assertions = "1.4.1"
