[package]
name = "check_cards"
version = "1.4.0"
edition = "2024"
rust-version = "1.97.0"
description = "A tool for checking for issues in Artistic Swimming Coach Cards"
homepage = "https://check-cards.web.app"
keywords = ["artistic", "swimming", "artistic-swimming", "synchro"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/leahych/check_cards"

[lib]
crate-type = ["cdylib", "lib"]

# speed up dev builds a bit
[profile.dev]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'
strip = true

[lints.rust]
future-incompatible = "warn"
keyword-idents = "warn"
let-underscore = "warn"
refining-impl-trait = "warn"
warnings = "warn"
unused = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
enum_glob_use = "allow"
missing-errors-doc = "allow"
similar-names = "allow"
trivially_copy_pass_by_ref = "allow"

[build-dependencies.chrono]
version = "0.4.45"
default-features = false
features = ["now"]

[dependencies]
anyhow = "1.0.103"
calamine = { version = "0.35.0", features = ["chrono"] }
console_error_panic_hook = "0.1.7"
semver = "1.0.28"
strum = "0.28"
strum_macros = "0.28"
wasm-bindgen = "0.2.121"


[dependencies.chrono]
version = "0.4.45"
default-features = false
features = ["alloc"]

[dependencies.gloo]
version = "0.12.0"
default-features = false
features = ["futures", "utils"]

[dependencies.web-sys]
version = "0.3.98"
features = ["Document", "HtmlInputElement", "HtmlTableElement", "HtmlTableSectionElement", "Text", "HtmlCollection"]

[dev-dependencies]
pretty_assertions = "1.4.1"
